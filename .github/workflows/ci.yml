name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m scoutsignal.pipeline all
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: model-report
          path: |
            artifacts/report.json
            artifacts/brief.md
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scoutsignal .
      - run: |
          docker run -d -p 7860:7860 --name app scoutsignal
          for i in $(seq 30); do curl -sf localhost:7860/api/health && exit 0; sleep 2; done
          docker logs app; exit 1
